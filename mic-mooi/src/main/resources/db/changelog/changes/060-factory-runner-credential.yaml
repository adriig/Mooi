databaseChangeLog:
  - changeSet:
      id: 060-factory-runner-credential
      author: mooi
      changes:
        # A sign-in is either a browser's (refresh token in a cookie) or the software factory's own
        # credential: one live per player, renewed only server-side, revoked with every sign-in.
        - sql:
            sql: |
              ALTER TABLE auth_sessions ADD COLUMN kind varchar(16) NOT NULL DEFAULT 'browser';
              ALTER TABLE auth_sessions ADD CONSTRAINT ck_auth_sessions_kind CHECK (kind IN ('browser', 'factory'));
              CREATE UNIQUE INDEX uq_auth_sessions_live_factory ON auth_sessions (player_id)
                WHERE kind = 'factory' AND revoked_at IS NULL;

              -- Why the runner paused an item on its own (e.g. its credential was revoked); NULL for a
              -- pause the player asked for.
              ALTER TABLE work_items ADD COLUMN pause_reason varchar(300);
              CREATE INDEX ix_work_items_runner_player_active ON work_items (runner_player_id)
                WHERE status IN ('running', 'paused');
