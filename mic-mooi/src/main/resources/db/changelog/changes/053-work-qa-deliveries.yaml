databaseChangeLog:
  - changeSet:
      id: 053-work-qa-deliveries
      author: mooi
      changes:
        - sql:
            sql: |
              ALTER TABLE work_tasks
                ADD COLUMN qa_report text,
                ADD COLUMN qa_rounds integer NOT NULL DEFAULT 0,
                ADD COLUMN finding_id varchar(100);

              UPDATE work_tasks qa
                SET qa_rounds = (SELECT count(*) FROM work_tasks fix WHERE fix.fix_of_id = qa.id)
                WHERE qa.qa_of_id IS NOT NULL;

              CREATE TABLE work_qa_deliveries (
                id uuid NOT NULL,
                qa_task_id uuid NOT NULL,
                delivery_id varchar(100) NOT NULL,
                outcome varchar(16) NOT NULL,
                payload text NOT NULL,
                CONSTRAINT pk_work_qa_deliveries PRIMARY KEY (id),
                CONSTRAINT fk_work_qa_deliveries_task FOREIGN KEY (qa_task_id)
                  REFERENCES work_tasks(id) ON DELETE CASCADE,
                CONSTRAINT uq_work_qa_deliveries_id UNIQUE (qa_task_id, delivery_id),
                CONSTRAINT ck_work_qa_deliveries_outcome CHECK (outcome IN ('passed', 'defect', 'blocked'))
              );
              CREATE INDEX ix_work_qa_deliveries_task ON work_qa_deliveries (qa_task_id);
      rollback:
        - dropTable:
            tableName: work_qa_deliveries
        - sql:
            sql: ALTER TABLE work_tasks DROP COLUMN qa_report, DROP COLUMN qa_rounds, DROP COLUMN finding_id
