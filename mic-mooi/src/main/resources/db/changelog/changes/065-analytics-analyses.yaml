databaseChangeLog:
  - changeSet:
      id: 065-analytics-analyses
      author: mooi
      changes:
        - sql:
            sql: |
              CREATE TABLE analytics_analyses (
                id uuid PRIMARY KEY,
                project_id uuid NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                player_id uuid NOT NULL REFERENCES players(id) ON DELETE CASCADE,
                period text NOT NULL,
                evidence text NOT NULL,
                result text,
                status varchar(32) NOT NULL,
                reason varchar(100),
                revision bigint NOT NULL DEFAULT 0,
                event_pending boolean NOT NULL DEFAULT true,
                created_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
              CREATE INDEX ix_analytics_analyses_owner_project_created
                ON analytics_analyses(player_id, project_id, created_at DESC, id DESC);
              CREATE INDEX ix_analytics_analyses_pending_events
                ON analytics_analyses(updated_at, id) WHERE event_pending = true;
      rollback:
        - dropTable:
            tableName: analytics_analyses
