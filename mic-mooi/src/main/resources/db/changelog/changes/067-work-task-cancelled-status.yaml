databaseChangeLog:
  - changeSet:
      id: 067-work-task-cancelled-status
      author: mooi
      changes:
        - sql:
            sql: |
              ALTER TABLE work_tasks DROP CONSTRAINT IF EXISTS ck_work_tasks_status;
              ALTER TABLE work_tasks ADD CONSTRAINT ck_work_tasks_status CHECK (status IN (
                  'planned', 'queued', 'running', 'merging', 'review', 'attention', 'done', 'cancelled'));
